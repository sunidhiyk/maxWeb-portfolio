<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ink field — void, the ground the page opens and closes on -->
  <rect width="64" height="64" fill="#000000" />
  <!-- Wordmark in hot pink -->
  <text
    x="32"
    y="42"
    font-family="'Inter Tight', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-size="30"
    font-weight="700"
    letter-spacing="-1.6"
    fill="#ff4ba7"
    text-anchor="middle"
  >mW</text>
  <!-- Accent tick — acid -->
  <rect x="52" y="52" width="6" height="6" fill="#fff70d" />
</svg>
